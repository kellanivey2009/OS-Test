---
name: My Fedora # Whatever I want it to be
description: Personal Image Test # Lil description

base-image: quay.io/fedora-ostree-desktops/silverblue # Base to start on
image-version: 44 # Version of Base

modules: # Where to? in files
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf # Mutable installs/uninstalls
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks # Flatpak installs/uninstalls
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        repo:
          name: flathub
          url: https://flathub.org/repo/flathub.flatpakrepo
          install: # system flatpaks we want all users to have and not remove
            - org.mozilla.firefox
            - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
